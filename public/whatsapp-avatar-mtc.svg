<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#111D33"/>
      <stop offset="60%" stop-color="#080E19"/>
      <stop offset="100%" stop-color="#04070D"/>
    </radialGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="ring-grad" x1="150" y1="150" x2="874" y2="874" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#1677FF"/>
    </linearGradient>

    <!-- Letter M Gradient -->
    <linearGradient id="m-grad" x1="300" y1="320" x2="480" y2="580" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>

    <!-- Letter C Gradient -->
    <linearGradient id="c-grad" x1="560" y1="320" x2="740" y2="580" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4096FF"/>
      <stop offset="50%" stop-color="#1677FF"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>

    <!-- Text Brand Gradient -->
    <linearGradient id="text-grad" x1="260" y1="670" x2="760" y2="670" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="45%" stop-color="#F87171"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="glow-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#1677FF" flood-opacity="0.3"/>
      <feDropShadow dx="0" dy="4" stdDeviation="16" flood-color="#F97316" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Deep Midnight Background -->
  <rect width="1024" height="1024" fill="url(#bg-glow)"/>

  <!-- Subtle Circular Ambient Rim (guides circular crop) -->
  <circle cx="512" cy="512" r="470" stroke="url(#ring-grad)" stroke-width="4" stroke-opacity="0.4"/>
  <circle cx="512" cy="512" r="460" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.1"/>

  <!-- Inner Monogram Card Container with Glow -->
  <g filter="url(#glow-shadow)">
    <rect x="256" y="190" width="512" height="420" rx="48" fill="#0C1525" stroke="url(#ring-grad)" stroke-width="5"/>
    
    <!-- Circuit Lines & Nodes -->
    <path d="M 310 540 L 410 540" stroke="#F97316" stroke-width="4" stroke-linecap="round" stroke-opacity="0.7"/>
    <circle cx="310" cy="540" r="6" fill="#F97316"/>
    
    <path d="M 614 540 L 714 540" stroke="#1677FF" stroke-width="4" stroke-linecap="round" stroke-opacity="0.7"/>
    <circle cx="714" cy="540" r="6" fill="#1677FF"/>

    <!-- Letter M -->
    <path d="M 330 510 V 270 L 416 380 L 502 270 V 510" 
          stroke="url(#m-grad)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Letter T -->
    <path d="M 456 270 H 596 M 526 270 V 510" 
          stroke="#FFFFFF" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Letter C -->
    <path d="M 686 300 C 655 265 605 260 575 278 C 530 305 530 460 575 488 C 610 510 655 500 686 470" 
          stroke="url(#c-grad)" 
          stroke-width="26" 
          stroke-linecap="round"/>

    <!-- Cyan Accent Glow Node -->
    <circle cx="640" cy="220" r="10" fill="#00F0FF"/>
    <circle cx="640" cy="220" r="18" fill="#00F0FF" fill-opacity="0.25"/>
  </g>

  <!-- Brand Name Typography: 'MrTech Care' -->
  <text x="512" y="720" 
        text-anchor="middle" 
        fill="url(#text-grad)" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" 
        font-weight="800" 
        font-size="68" 
        letter-spacing="2">MrTech Care</text>

  <!-- Tagline: 'YOUR TECH. OUR CARE.' -->
  <text x="512" y="785" 
        text-anchor="middle" 
        fill="#94A3B8" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="700" 
        font-size="24" 
        letter-spacing="6">YOUR TECH. OUR CARE.</text>

  <!-- Certified Support Pill Badge -->
  <g transform="translate(362, 825)">
    <rect width="300" height="42" rx="21" fill="#111D33" stroke="#F97316" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="28" cy="21" r="5" fill="#10B981"/>
    <text x="160" y="27" 
          text-anchor="middle" 
          fill="#E2E8F0" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-weight="700" 
          font-size="15" 
          letter-spacing="2">VERIFIED IT SUPPORT</text>
  </g>
</svg>